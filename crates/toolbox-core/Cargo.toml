[package]
name = "toolbox-core"
version = "0.1.0"
description = "The IT Tools toolbox core: every Tool's behaviour, with no dependency on Tauri or the UI."
edition = "2024"
publish = false

[dependencies]
chrono = "0.4"
futures-util = "0.3"
gethostname = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
